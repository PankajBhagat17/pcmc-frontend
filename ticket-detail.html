<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket Details - PCMC Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans min-h-screen">

    <!-- Top Navigation -->
    <nav class="bg-white border-b border-slate-200 px-6 py-4 flex flex-wrap justify-between items-center gap-4">
        <h1 class="text-xl font-bold text-blue-900">PCMC Official Portal</h1>
        
        <div class="flex flex-wrap items-center gap-3 sm:gap-6 text-xs sm:text-sm font-medium text-slate-600">
            <a href="admin.html" class="hover:text-blue-600 transition-colors">Dashboard</a>
            <a href="grievances.html" class="hover:text-blue-600 transition-colors">Grievances</a>
            <a href="reports.html" class="hover:text-blue-600 transition-colors">Reports</a>
            <a href="departments.html" class="hover:text-blue-600 transition-colors">Departments</a>
        </div>
        
        <button onclick="localStorage.removeItem('pcmc_token'); window.location.href='login.html'" class="text-sm font-semibold text-red-600 border border-red-200 px-4 py-2 rounded hover:bg-red-50 transition-colors">
            Logout
        </button>
    </nav>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto p-6 mt-6">
        <div class="mb-6 flex justify-between items-center">
            <a href="admin.html" class="text-sm font-semibold text-blue-600 hover:underline">← Back to Dashboard</a>
            <div class="flex items-center gap-3">
                <span class="text-sm font-medium text-slate-600">Update Status:</span>
                <select id="statusUpdateSelect" class="text-sm border border-slate-300 rounded px-3 py-1.5 bg-white font-medium text-slate-700 focus:outline-none focus:border-blue-600">
                    <option value="Pending">Pending</option>
                    <option value="In-Progress">In-Progress</option>
                    <option value="Resolved">Resolved</option>
                </select>
            </div>
        </div>

        <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-8">
            <div class="flex flex-wrap justify-between items-start gap-4 pb-6 border-b border-slate-200 mb-6">
                <div>
                    <span id="ticketIdDisplay" class="text-xs font-bold text-blue-600 bg-blue-50 px-2.5 py-1 rounded border border-blue-100 uppercase tracking-wider">PCMC---------</span>
                    <h2 id="ticketTitle" class="text-2xl font-bold text-slate-900 mt-2">Loading Grievance...</h2>
                </div>
                <div class="flex items-center gap-2">
                    <span id="ticketUrgencyBadge" class="px-3 py-1 text-xs font-bold rounded">Urgency</span>
                    <span id="ticketStatusBadge" class="px-3 py-1 text-xs font-bold rounded">Status</span>
                </div>
            </div>

            <!-- Ticket Metadata Grid -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8 bg-slate-50 p-4 rounded-lg border border-slate-100">
                <div>
                    <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Department</p>
                    <p id="ticketDepartment" class="text-sm font-bold text-slate-800 mt-1">--</p>
                </div>
                <div>
                    <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Date Submitted</p>
                    <p id="ticketDate" class="text-sm font-bold text-slate-800 mt-1">--</p>
                </div>
                <div>
                    <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Citizen Name</p>
                    <p id="ticketCitizenName" class="text-sm font-bold text-slate-800 mt-1">--</p>
                </div>
                <div>
                    <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Citizen Mobile</p>
                    <p id="ticketCitizenMobile" class="text-sm font-bold text-slate-800 mt-1">--</p>
                </div>
            </div>

            <!-- Location Section -->
            <div class="mb-6">
                <h3 class="text-sm font-semibold text-slate-400 uppercase tracking-wider mb-2">Reported Location</h3>
                <p id="ticketLocation" class="text-slate-700 bg-slate-50 p-3 rounded border border-slate-200 text-sm font-medium">--</p>
            </div>

            <!-- Description / Raw Text -->
            <div>
                <h3 class="text-sm font-semibold text-slate-400 uppercase tracking-wider mb-2">Grievance Description</h3>
                <p id="ticketDescription" class="text-slate-700 bg-slate-50 p-4 rounded border border-slate-200 text-sm leading-relaxed whitespace-pre-wrap">Fetching description...</p>
            </div>
        </div>
    </main>

    <!-- JavaScript Execution Block -->
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            // 1. Verify Authentication
            const token = localStorage.getItem("pcmc_token");
            if (!token) {
                alert("Session expired. Please log in again.");
                window.location.href = "login.html";
                return;
            }

            // 2. Extract Ticket ID from URL (e.g., ?id=6acfb...)
            const urlParams = new URLSearchParams(window.location.search);
            const ticketId = urlParams.get('id');

            if (!ticketId) {
                alert("No ticket ID provided.");
                window.location.href = "admin.html";
                return;
            }

            // DOM Elements referencing your existing HTML
            const ticketTitle = document.getElementById('ticketTitle');
            const ticketIdDisplay = document.getElementById('ticketIdDisplay');
            const statusBadge = document.getElementById('ticketStatusBadge');
            const urgencyBadge = document.getElementById('ticketUrgencyBadge');
            
            const citizenName = document.getElementById('ticketCitizenName');
            const citizenMobile = document.getElementById('ticketCitizenMobile');
            const ticketDate = document.getElementById('ticketDate');
            const departmentDisplay = document.getElementById('ticketDepartment');
            const locationDisplay = document.getElementById('ticketLocation');
            const descriptionDisplay = document.getElementById('ticketDescription');
            
            const statusSelect = document.getElementById('statusUpdateSelect');

            try {
                // 3. Fetch specific ticket data from backend
                let response = await fetch(`https://pcmc-admin.onrender.com/api/grievances/${ticketId}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.status === 404) {
                    response = await fetch(`https://pcmc-admin.onrender.com/grievances/${ticketId}`, {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                }

                if (!response.ok) throw new Error("Failed to fetch ticket details.");

                const ticket = await response.json();

                // 4. Populate the HTML with REAL data from the citizen
                const formattedId = ticket._id.substring(0, 8).toUpperCase();
                ticketIdDisplay.innerText = `PCMC-${formattedId}`;
                ticketTitle.innerText = `${ticket.department} Grievance`;
                
                // Formatted Date
                const d = new Date(ticket.createdAt);
                ticketDate.innerText = d.toLocaleDateString('en-IN', { month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit' });

                // Department & Location (Actual typed manual location)
                departmentDisplay.innerText = ticket.department;
                locationDisplay.innerText = ticket.location || "Location not provided";
                descriptionDisplay.innerText = ticket.rawText;

                // Citizen Details (if populated from MongoDB populate)
                if (ticket.citizenId && ticket.citizenId.name) {
                    citizenName.innerText = ticket.citizenId.name;
                    citizenMobile.innerText = ticket.citizenId.mobile || "No mobile provided";
                } else {
                    citizenName.innerText = "Citizen User";
                    citizenMobile.innerText = "--";
                }

                // Status Badge Styling
                statusBadge.innerText = ticket.status;
                if (ticket.status === 'Resolved') {
                    statusBadge.className = "bg-green-100 text-green-800 px-2 py-1 rounded text-xs font-bold border border-green-200";
                } else if (ticket.status === 'In-Progress') {
                    statusBadge.className = "bg-orange-100 text-orange-800 px-2 py-1 rounded text-xs font-bold border border-orange-200";
                } else {
                    statusBadge.className = "bg-slate-100 text-slate-700 px-2 py-1 rounded text-xs font-bold border border-slate-200";
                }

                // Urgency Badge Styling
                urgencyBadge.innerText = ticket.urgency;
                if (ticket.urgency === 'High' || ticket.urgency === 'Critical') {
                    urgencyBadge.className = "bg-red-100 text-red-800 px-2 py-1 rounded text-xs font-bold border border-red-200";
                } else {
                    urgencyBadge.className = "bg-blue-100 text-blue-800 px-2 py-1 rounded text-xs font-bold border border-blue-200";
                }

                // Pre-select current status in dropdown
                statusSelect.value = ticket.status;

            } catch (error) {
                console.error("Error loading ticket:", error);
                ticketTitle.innerText = "Error Loading Ticket";
                descriptionDisplay.innerText = "Could not fetch details. Please check connection.";
            }

            // 5. Handle Status Update from the existing Dropdown Select
            if (statusSelect) {
                statusSelect.addEventListener('change', async (e) => {
                    const newStatus = e.target.value;
                    
                    // Confirm action
                    if (!confirm(`Are you sure you want to mark this ticket as ${newStatus}?`)) {
                        return; // Cancelled
                    }

                    try {
                        let updateUrl = `https://pcmc-admin.onrender.com/api/grievances/${ticketId}/status`;
                        
                        let res = await fetch(updateUrl, {
                            method: 'PATCH',
                            headers: { 
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${token}` 
                            },
                            body: JSON.stringify({ status: newStatus })
                        });

                        if (res.status === 404) {
                            updateUrl = `https://pcmc-admin.onrender.com/grievances/${ticketId}/status`;
                            res = await fetch(updateUrl, {
                                method: 'PATCH',
                                headers: { 
                                    'Content-Type': 'application/json',
                                    'Authorization': `Bearer ${token}` 
                                },
                                body: JSON.stringify({ status: newStatus })
                            });
                        }

                        if (!res.ok) throw new Error("Status update failed");

                        alert(`Ticket successfully updated to ${newStatus}`);
                        window.location.reload(); // Refresh to show new badge colors

                    } catch (error) {
                        console.error(error);
                        alert("Error updating ticket status. Ensure backend is running.");
                    }
                });
            }
        });
    </script>
</body>
</html>
