<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PCMC Digital Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative font-sans bg-slate-900" 
      style="background-image: url('js/pcmc-bg.jpg'); background-size: cover; background-position: center; background-repeat: no-repeat;">
    
    <div class="absolute inset-0 bg-[#0f4a73]/70 backdrop-blur-sm"></div>

    <main class="relative bg-white w-full max-w-md rounded-2xl shadow-2xl overflow-hidden flex flex-col z-10">
        
        <div class="px-8 pt-8 pb-4 text-center">
            <div class="flex justify-center items-center gap-2 text-blue-900 mb-2">
                <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 15l10 5 10-5M2 11l10 5 10-5"/></svg>
                <h1 class="text-2xl font-bold tracking-tight">PCMC Portal</h1>
            </div>
            <h2 class="text-xl font-bold text-slate-800 mt-4">Welcome Back</h2>
            <p class="text-slate-500 text-sm mt-1">Please authenticate to access your account.</p>
        </div>

        <div class="flex border-b border-slate-200 mx-8 mt-2">
            <button id="tabCitizen" class="flex-1 pb-3 text-sm font-bold text-blue-900 border-b-2 border-blue-900 transition-colors">Citizen Login</button>
            <button id="tabOfficer" class="flex-1 pb-3 text-sm font-medium text-slate-500 hover:text-blue-900 transition-colors">Officer Login</button>
        </div>

        <div class="px-8 py-6">
            
            <!-- Citizen Form -->
            <div id="citizenFormContainer" class="block">
                <form id="citizenForm" class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">Mobile Number</label>
                        <div class="flex border border-slate-300 rounded-lg overflow-hidden focus-within:ring-2 focus-within:ring-blue-500 shadow-sm transition-all">
                            <span class="bg-slate-50 px-3 py-2.5 text-slate-500 text-sm border-r border-slate-300 font-medium">+91</span>
                            <input type="tel" id="citizenMobile" placeholder="10-digit mobile number" required maxlength="10" class="w-full px-4 py-2 text-sm outline-none text-slate-800">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">Password</label>
                        <input type="password" id="citizenPassword" placeholder="Enter your password" required class="w-full px-4 py-2 text-sm border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 shadow-sm transition-all">
                    </div>

                    <div id="citizenError" class="hidden text-xs text-red-600 bg-red-50 p-2 rounded border border-red-200"></div>
                    
                    <button type="submit" id="citizenSubmitBtn" class="w-full bg-[#0f4a73] hover:bg-blue-900 text-white font-bold py-3 px-4 rounded-lg text-sm transition-colors flex justify-center items-center gap-2 shadow-md mt-2">
                        <span>Login</span> <span>→</span>
                    </button>
                </form>

                <div class="text-center mt-6 mb-2">
                    <p class="text-sm text-slate-600">Don't have an account? <a href="signup.html" class="text-blue-700 font-bold hover:underline">Sign up</a></p>
                </div>
            </div>

            <!-- Officer Form -->
            <div id="officerFormContainer" class="hidden">
                <form id="officerForm" class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">Official Employee ID</label>
                        <input type="text" placeholder="e.g. PCMC-EMP-889" required class="w-full px-4 py-2 text-sm border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 shadow-sm transition-all">
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">Secure Password</label>
                        <input type="password" placeholder="Enter your password" required class="w-full px-4 py-2 text-sm border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 shadow-sm transition-all">
                    </div>
                    
                    <button type="submit" class="w-full bg-slate-900 hover:bg-black text-white font-bold py-3 px-4 rounded-lg text-sm transition-colors flex justify-center items-center gap-2 shadow-md mt-4">
                        Secure Officer Login <span>→</span>
                    </button>
                </form>
            </div>
        </div>
    </main>

    <!-- Connect JS Scripts -->
    <script src="js/api.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
