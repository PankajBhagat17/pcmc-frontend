<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Public Transparency Stats - PCMC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Include Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">
    <!-- Citizen Navbar -->
    <header class="w-full border-b border-gray-100 bg-white sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <a href="landing.html" class="flex items-center gap-2">
                    <span class="font-bold text-lg text-blue-950">PCMC Grievance Portal</span>
                </a>
                <nav class="hidden md:flex gap-8">
                    <a href="landing.html" class="text-sm font-medium text-gray-500 hover:text-blue-950">Home</a>
                    <a href="track-status.html" class="text-sm font-medium text-gray-500 hover:text-blue-950">Track</a>
                    <a href="public-stats.html" class="text-sm font-semibold text-blue-950 border-b-2 border-blue-950 pb-1">Public Stats</a>
                </nav>
                <div class="flex items-center gap-4">
                    <a href="login.html" class="text-sm font-medium text-blue-900 bg-blue-50 px-4 py-2 rounded-md hover:bg-blue-100 border border-blue-100">Sign Up/Login</a>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-6xl mx-auto w-full px-4 py-12">
        <div class="text-center mb-12">
            <h1 class="text-3xl md:text-4xl font-extrabold text-blue-950 mb-4">Transparency Dashboard</h1>
            <p class="text-gray-500 text-lg">Real-time civic resolution metrics for Pimpri-Chinchwad.</p>
        </div>

        <!-- Total Counter -->
        <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100 text-center max-w-sm mx-auto mb-12">
            <h3 class="text-gray-400 font-bold uppercase tracking-wide text-xs mb-2">Total Grievances Processed</h3>
            <p id="totalProcessedStat" class="text-5xl font-extrabold text-blue-950">...</p>
        </div>

        <!-- Chart Section -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- Department Bar Chart -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 lg:col-span-2">
                <h3 class="text-lg font-bold text-blue-950 mb-6">Department Load Overview</h3>
                <div class="relative h-80 w-full">
                    <canvas id="deptChart"></canvas>
                </div>
            </div>

            <!-- Status Doughnut Chart -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                <h3 class="text-lg font-bold text-blue-950 mb-6">Resolution Status</h3>
                <div class="relative h-80 w-full flex justify-center items-center">
                    <canvas id="statusChart"></canvas>
                </div>
            </div>

        </div>
    </main>
    
    <footer class="bg-[#f8fafc] border-t border-gray-200 py-12 mt-12">
        <div class="max-w-6xl mx-auto px-4 text-center">
            <p class="text-sm text-gray-400">&copy; 2026 Pimpri-Chinchwad Municipal Corporation.</p>
        </div>
    </footer>

    <!-- Connect your JS file -->
    <script src="js/public-stats.js"></script>
</body>
</html>
