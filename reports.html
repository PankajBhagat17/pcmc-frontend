<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports & Analytics - PCMC Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans min-h-screen">

    <!-- Top Navigation -->
    <nav class="bg-white px-8 py-4 flex justify-between items-center shadow-sm flex-wrap gap-4">
        <h1 class="text-xl font-bold text-blue-900 tracking-tight">PCMC Official Portal</h1>
        
        <div class="flex flex-wrap items-center gap-3 sm:gap-6 text-xs sm:text-sm font-medium text-slate-600">
            <a href="admin.html" class="hover:text-blue-600 transition-colors">Dashboard</a>
            <a href="grievances.html" class="hover:text-blue-600 transition-colors">Grievances</a>
            <a href="reports.html" class="text-blue-600 border-b-2 border-blue-600 pb-1">Reports</a>
            <a href="departments.html" class="hover:text-blue-600 transition-colors">Departments</a>
        </div>
        
        <button id="switchDeptBtn" class="bg-white text-slate-600 border border-slate-300 text-sm font-semibold px-4 py-2 rounded-lg hover:bg-slate-50 whitespace-nowrap">
            Switch Dept
        </button>
    </nav>

    <main class="max-w-7xl mx-auto p-6 mt-4">
        <h2 class="text-2xl font-bold text-slate-800 mb-6">Performance Analytics</h2>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
            <!-- Line Chart Area -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 h-80 flex flex-col">
                <h3 class="font-bold text-slate-700 mb-4">Avg. Resolution Time (Days) - MTD</h3>
                <div class="flex-grow relative w-full h-full">
                    <canvas id="trendChart"></canvas>
                </div>
            </div>
            
            <!-- Doughnut Chart Area -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 h-80 flex flex-col">
                <h3 class="font-bold text-slate-700 mb-4">Live Departmental Load</h3>
                <div class="flex-grow relative w-full h-full flex justify-center">
                    <canvas id="categoryChart"></canvas>
                </div>
            </div>
        </div>

        <!-- Export Section -->
        <section class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 flex flex-wrap justify-between items-center gap-4">
            <div>
                <h3 class="font-bold text-slate-800">Generate Official Report</h3>
                <p class="text-sm text-slate-500">Download formatted data for auditing and municipal presentations.</p>
            </div>
            <div class="flex gap-3 w-full md:w-auto">
                <button id="exportCsvBtn" class="flex-1 md:flex-none bg-blue-900 text-white px-4 py-2 rounded text-sm font-bold hover:bg-blue-800 transition-colors shadow-sm">
                    Export Raw CSV Data
                </button>
            </div>
        </section>
    </main>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/reports.js"></script>
</body>
</html>
