<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Citizen Sign Up - PCMC Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex items-center justify-center p-4 md:p-8 relative font-sans" 
      style="background-image: url('js/pcmc-bg.jpg'); background-size: cover; background-position: center;">
    
    <div class="absolute inset-0 bg-[#0f4a73]/80 backdrop-blur-sm"></div>

    <main class="relative bg-white w-full max-w-5xl rounded-2xl shadow-2xl overflow-hidden flex flex-col md:flex-row z-10 max-h-[95vh]">
        
        <div class="hidden md:flex md:w-5/12 relative p-10 flex-col justify-end bg-slate-900" 
             style="background-image: url('js/pcmc-bg.jpg'); background-size: cover; background-position: center;">
            <div class="absolute inset-0 bg-gradient-to-t from-slate-900/90 via-slate-900/40 to-transparent"></div>
            <div class="relative z-10 text-white">
                <div class="flex items-center gap-2 mb-4">
                    <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 15l10 5 10-5M2 11l10 5 10-5"/></svg>
                </div>
                <h2 class="text-3xl font-bold mb-3 leading-tight">Join the Smart City Initiative</h2>
                <p class="text-slate-300 text-sm leading-relaxed">
                    Register to easily file grievances, track resolutions, and participate in local governance.
                </p>
            </div>
        </div>

        <div class="w-full md:w-7/12 p-8 md:p-10 overflow-y-auto custom-scrollbar">
            
            <div class="mb-6">
                <h2 class="text-2xl font-bold text-slate-800">Create an Account</h2>
                <p class="text-slate-500 text-sm mt-1">Enter your details to get started with PCMC services.</p>
            </div>

            <!-- Error Box -->
            <div id="signupError" class="hidden mb-4 p-3 bg-red-100 text-red-700 text-sm rounded-lg font-semibold"></div>

            <form id="signupForm" class="space-y-5">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">Full Name *</label>
                        <input type="text" id="signupName" placeholder="Enter your full name" required class="w-full px-4 py-2 text-sm border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">Email Address (Optional)</label>
                        <input type="email" id="signupEmail" placeholder="Enter your email" class="w-full px-4 py-2 text-sm border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-xs font-bold text-slate-700 mb-1">Mobile Number *</label>
                        <div class="flex border border-slate-300 rounded-lg overflow-hidden focus-within:ring-2 focus-within:ring-blue-500">
                            <span class="bg-slate-50 px-3 py-2 text-slate-500 text-sm border-r border-slate-300 font-medium">+91</span>
                            <input type="tel" id="signupMobile" placeholder="10-digit mobile number" required maxlength="10" class="w-full px-4 py-2 text-sm outline-none">
                        </div>
                    </div>
                </div>

                <div class="pt-4 mt-4 border-t border-slate-100">
                    <h3 class="text-sm font-bold text-blue-900 mb-4 flex items-center gap-2">
                        Primary Address (Required for Grievances)
                    </h3>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">Flat / House No. / Building *</label>
                            <input type="text" id="signupFlat" placeholder="e.g. A-102, Shivam Apts" required class="w-full px-4 py-2 text-sm border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">Street / Area *</label>
                            <input type="text" id="signupStreet" placeholder="e.g. Wakad Road" required class="w-full px-4 py-2 text-sm border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">Landmark</label>
                            <input type="text" id="signupLandmark" placeholder="Nearby landmark" class="w-full px-4 py-2 text-sm border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 mb-1">Pincode *</label>
                            <input type="text" id="signupPincode" placeholder="e.g. 411057" required maxlength="6" class="w-full px-4 py-2 text-sm border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
                        </div>
                        <div class="md:col-span-2">
                            <label class="block text-xs font-bold text-slate-700 mb-1">Residential Ward *</label>
                            <select id="signupWard" required class="w-full px-4 py-2 text-sm border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500 bg-white">
                                <option value="" disabled selected>Select your municipal ward</option>
                                <option value="A">Ward A (Nigdi, Akurdi)</option>
                                <option value="B">Ward B (Chinchwad, Thergaon)</option>
                                <option value="C">Ward C (Bhosari, Nehrunagar)</option>
                                <option value="D">Ward D (Wakad, Pimple Saudagar)</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="pt-4 mt-4 border-t border-slate-100 grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">Password *</label>
                        <input type="password" id="signupPassword" placeholder="Create a strong password" required class="w-full px-4 py-2 text-sm border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">Confirm Password *</label>
                        <input type="password" id="signupConfirmPassword" placeholder="Re-enter password" required class="w-full px-4 py-2 text-sm border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>

                <button type="submit" id="signupSubmitBtn" class="w-full bg-[#0f4a73] hover:bg-blue-900 text-white font-bold py-3 px-4 rounded-lg text-sm transition-colors mt-6 shadow-md">
                    Sign Up
                </button>
            </form>

            <div class="text-center mt-6 pb-4">
                <p class="text-sm text-slate-600">Already have an account? <a href="login.html" class="text-blue-700 font-bold hover:underline">Login</a></p>
            </div>
        </div>
    </main>

    <!-- Connect JS Scripts -->
    <script src="js/api.js"></script>
    <script src="js/signup.js"></script>
</body>
</html>
